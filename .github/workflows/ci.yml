name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Test, Coverage, CRAP & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: File-length discipline (max 100 lines)
        run: npm run check:lines
      - name: Feature-coverage map
        run: npm run check:features
      - name: Unit tests with coverage (80% floor)
        run: npm run test:coverage
      - name: CRAP score analysis (threshold 15)
        run: npm run crap
      - name: Build
        run: npm run build
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  acceptance:
    # One job per feature area, each its own check. Every job boots a fresh
    # PocketBase via docker-compose (the exact self-hosted stack users deploy),
    # seeds it to a known state, then runs that area's Gherkin specs. Grows a
    # matrix entry per feature area as slices land (check:features enforces this).
    name: Acceptance Tests (${{ matrix.area.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        area:
          - name: auth
            paths: .features-gen/e2e/features/auth
          - name: a11y
            paths: .features-gen/e2e/features/a11y
          - name: mobile
            paths: .features-gen/e2e/features/mobile
          - name: pages
            paths: .features-gen/e2e/features/pages
          - name: settings
            paths: .features-gen/e2e/features/settings
          - name: home
            paths: .features-gen/e2e/features/home
          - name: help
            paths: .features-gen/e2e/features/help
          - name: sharing
            paths: .features-gen/e2e/features/sharing
          - name: typing
            paths: .features-gen/e2e/features/typing
          - name: paste
            paths: .features-gen/e2e/features/paste
          - name: editing
            paths: .features-gen/e2e/features/editing
          - name: errors
            paths: .features-gen/e2e/features/errors
          - name: toggle
            paths: .features-gen/e2e/features/toggle
          - name: upload
            paths: .features-gen/e2e/features/upload
          - name: reorder-pages
            paths: .features-gen/e2e/features/reorder-pages
          - name: table
            paths: .features-gen/e2e/features/table
          - name: mention
            paths: .features-gen/e2e/features/mention
          - name: color
            paths: .features-gen/e2e/features/color
          - name: align
            paths: .features-gen/e2e/features/align
          - name: board
            paths: .features-gen/e2e/features/board
          - name: gallery
            paths: .features-gen/e2e/features/gallery
          - name: calendar
            paths: .features-gen/e2e/features/calendar
          - name: grouping
            paths: .features-gen/e2e/features/grouping
          - name: cover
            paths: .features-gen/e2e/features/cover
          - name: backlinks
            paths: .features-gen/e2e/features/backlinks
          - name: columns
            paths: .features-gen/e2e/features/columns
          - name: comments
            paths: .features-gen/e2e/features/comments
          - name: toc
            paths: .features-gen/e2e/features/toc
          - name: codecopy
            paths: .features-gen/e2e/features/codecopy
          - name: shortcuts
            paths: .features-gen/e2e/features/shortcuts
          - name: realtime
            paths: .features-gen/e2e/features/realtime
          - name: turn-into
            paths: .features-gen/e2e/features/turn-into
          - name: codelang
            paths: .features-gen/e2e/features/codelang
          - name: links
            paths: .features-gen/e2e/features/links
          - name: font
            paths: .features-gen/e2e/features/font
          - name: collab
            paths: .features-gen/e2e/features/collab
          - name: blockselect
            paths: .features-gen/e2e/features/blockselect
          - name: presence
            paths: .features-gen/e2e/features/presence
          - name: cursors
            paths: .features-gen/e2e/features/cursors
    env:
      VITE_PB_URL: http://localhost:8090
      PB_ADMIN_EMAIL: admin@pagevault.local
      PB_ADMIN_PASSWORD: AdminPass123!
      TEST_USERNAME: test@example.com
      TEST_PASSWORD: TestPassw0rd!
      COLLAB_USERNAME: collab@example.com
      COLLAB_PASSWORD: TestPassw0rd!
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the PocketBase image (retry transient registry errors)
        run: |
          # Docker Hub occasionally 500s on the base image pull; a transient
          # registry blip shouldn't fail the whole matrix, so retry with backoff.
          for attempt in 1 2 3; do
            if docker compose build; then exit 0; fi
            echo "docker compose build failed (attempt $attempt) — retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "docker compose build failed after 3 attempts"
          exit 1
      - name: Boot PocketBase (docker compose)
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            curl -sf http://localhost:8090/api/health && break
            sleep 1
          done
      - name: Create the PocketBase superuser
        run: |
          docker compose exec -T pocketbase /pb/pocketbase \
            --dir=/pb_data --migrationsDir=/pb_migrations \
            superuser upsert "$PB_ADMIN_EMAIL" "$PB_ADMIN_PASSWORD"
      - name: Seed the backend to a known state
        run: npm run seed
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run acceptance tests (${{ matrix.area.name }})
        run: npx bddgen && npx playwright test ${{ matrix.area.paths }}
      - name: Tear down PocketBase
        if: always()
        run: docker compose down
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.area.name }}
          path: playwright-report/
          retention-days: 7
